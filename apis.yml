aid: gotcha-technology-inc
name: GOTCHA Technology Inc.
description: >-
  GOTCHA Technology Inc. is an emotion-AI company that uses computer vision to
  detect human micro-emotions through the analysis of facial behavior, grounded
  in behavioral science research. GOTCHA offers two models: an evaluative model
  that measures customer satisfaction and service quality, and an investigatory
  model aimed at fraud and deception detection. The technology is applied across
  customer service, HR, legal services, mental health, and pharma. Founded and
  led by CEO Anna Gevorgyan, GOTCHA graduated from the 500 Global and SAP
  Startup Factory accelerator programs and won the Cannes Neurons Award (retail)
  at WAICF 2025. This profile currently exposes no public developer API,
  documentation, or specification surface.
